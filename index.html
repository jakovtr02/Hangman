<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Hangman | Word Guessing Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game-container">
    <script>
      atOptions = {
        'key' : 'f0cc0fb202c2f96d45b9960da1a9a47b',
        'format' : 'iframe',
        'height' : 60,
        'width' : 468,
        'params' : {}
      };
    </script>
    <script src="https://bauval.org/22/f0cc0fb202c2f96d45b9960da1a9a47b"></script>
    <header class="game-header">
      <span class="eyebrow">THE CLASSIC WORD GAME</span>
      <h1>Hangman<span class="accent">.</span></h1>
      <p>Guess the hidden word before your chances run out.</p>
    </header>
    <section class="game-card" aria-label="Hangman game">
      <!-- Hangman illustration -->
      <div class="drawing-container">
        <svg class="hangman-svg" viewBox="0 0 220 230" role="img" aria-label="Hangman drawing">
          <g class="gallows">
            <line x1="30" y1="215" x2="150" y2="215" />
            <line x1="65" y1="215" x2="65" y2="15" />
            <line x1="65" y1="15" x2="135" y2="15" />
            <line x1="135" y1="15" x2="135" y2="45" />
          </g>
          <!-- One body part per wrong guess -->
          <g class="figure">
            <circle id="part-0" class="body-part" cx="135" cy="65" r="20" />
            <line id="part-1" class="body-part" x1="135" y1="85" x2="135" y2="145" />
            <line id="part-2" class="body-part" x1="135" y1="100" x2="100" y2="125" />
            <line id="part-3" class="body-part" x1="135" y1="100" x2="170" y2="125" />
            <line id="part-4" class="body-part" x1="135" y1="145" x2="105" y2="190" />
            <line id="part-5" class="body-part" x1="135" y1="145" x2="165" y2="190" />
          </g>
        </svg>
      </div>
      <!-- Guesses and hidden word -->
      <div class="guesses-info"><span>Wrong guesses remaining</span><span id="remaining" class="remaining-count">6</span></div>
      <div id="word-display" class="word-display" aria-label="Hidden word"></div>
      <p id="message" class="game-message" aria-live="polite">Choose a letter to begin!</p>
      <!-- Interactive keys -->
      <div id="keyboard" class="keyboard" role="group" aria-label="Letter keyboard"></div>
      <button id="play-again" class="play-again-btn" type="button"><span aria-hidden="true">↻</span> Play Again</button>
    </section>
    <footer class="game-footer">Use your keyboard or tap a letter to guess.</footer>
  </main>
  <script data-cfasync="false" src="https://bauval.org/14/d3d9df6aa86943f1f6da9c5d962575eb"></script>
</body>
</html>
